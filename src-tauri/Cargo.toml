[package]
name = "gloam"
version = "1.0.0"
description = "A floating, ambient focus timer that lives in the corner of your screen."
authors = ["Damond"]
license = "MIT"
repository = "https://github.com/damondrc/gloam"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gloam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: the shortcut is the escape hatch out of lock mode, so it has no
# meaning on mobile targets. Nor does launching with the session.
#
# autostart is a dependency rather than a dozen lines of our own because there
# is no shared mechanism underneath it to write those lines against: a registry
# value under Run on Windows, a .desktop file in ~/.config/autostart on Linux,
# a launch agent plist on macOS — three formats, three locations, and three
# sets of rules about quoting a path that has a space in it. This is the
# official plugin, versioned with Tauri itself, and it is the kind of code that
# is only ever wrong on the machine you do not have.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

# Decoding and playback, deliberately not through the WebView.
#
# WebKitGTK routes all web audio through gstreamer, and FLAC lives in a plugin
# package a machine may or may not have — which is exactly what made the
# AppImage ship silent. rodio decodes with symphonia, which is pure Rust and
# inside the binary, and writes to the device through cpal. The only thing
# between a file and the speakers is code that shipped with the app.
#
# Default features carry FLAC, MP3, Vorbis, WAV and AAC, which is the whole
# list this player claims. Held at 0.21 by the crate's own rust-version rule
# rather than by preference: 0.22 wants a newer compiler than Gloam asks for,
# and nothing in it is needed here.
rodio = "0.21"

# The widget sits idle for long stretches, so favour a small, fast binary over
# compile time in release builds.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
