[package]
name = "gloam"
version = "0.1.0"
description = "A floating, ambient focus timer that lives in the corner of your screen."
authors = ["Damond"]
license = "MIT"
repository = "https://github.com/damondrc99/gloam"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gloam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: the shortcut is the escape hatch out of lock mode, so it has no
# meaning on mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# The widget sits idle for long stretches, so favour a small, fast binary over
# compile time in release builds.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
